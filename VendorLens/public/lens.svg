<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Outer Rim Gradient -->
    <linearGradient id="lens-rim" x1="4" y1="4" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Glass Interior Gradient -->
    <radialGradient id="lens-glass" cx="10.5" cy="10.5" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#6366F1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#312E81" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Handle Gradient -->
    <linearGradient id="lens-handle" x1="18" y1="18" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="40%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Collar Gradient -->
    <linearGradient id="lens-collar" x1="18" y1="21" x2="21" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="lens-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#1E1B4B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#lens-shadow)">
    <!-- Handle -->
    <line x1="20" y1="20" x2="27" y2="27" stroke="url(#lens-handle)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Handle Highlight -->
    <line x1="20.8" y1="19.6" x2="26.4" y2="25.2" stroke="#C7D2FE" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.8"/>

    <!-- Handle Connector / Collar -->
    <line x1="18.6" y1="20.6" x2="20.6" y2="18.6" stroke="url(#lens-collar)" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Lens Glass Fill -->
    <circle cx="12.5" cy="12.5" r="7.5" fill="url(#lens-glass)"/>

    <!-- Concentric Optical / Aperture Ring -->
    <circle cx="12.5" cy="12.5" r="4.2" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.75" fill="none"/>
    <circle cx="12.5" cy="12.5" r="1.6" fill="#38BDF8" fill-opacity="0.4" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="0.6"/>

    <!-- Outer Rim -->
    <circle cx="12.5" cy="12.5" r="7.8" stroke="url(#lens-rim)" stroke-width="2.2" fill="none"/>

    <!-- Specular Highlight (Primary Light Arc) -->
    <path d="M 8 12.5 A 5.2 5.2 0 0 1 13.5 7" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.95"/>

    <!-- Specular Secondary Sparkle -->
    <circle cx="9" cy="9" r="0.65" fill="#FFFFFF" fill-opacity="0.9"/>

    <!-- Bottom-right Rim Backlight Reflection -->
    <path d="M 13.5 17 A 5 5 0 0 0 17 13.5" stroke="#A5F3FC" stroke-width="0.85" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>
</svg>